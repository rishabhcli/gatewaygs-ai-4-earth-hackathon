[project]
name = "gatewaygs-ai-4-earth-hackathon"
version = "0.1.0"
description = "Reproducible Sentinel-2 methane plume evidence pipeline"
readme = "README.md"
requires-python = ">=3.14.7,<3.15"
license = "UNLICENSED"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "minio==7.2.20",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "urllib3==2.7.0",
  "uvicorn==0.52.1",
]

[dependency-groups]
dev = [
  "hypothesis==6.165.2",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
]

[tool.uv]
package = false
required-version = "==0.12.3"

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--showlocals",
  "--cov=services",
  "--cov=workers",
  "--cov=scripts",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=85",
]
asyncio_mode = "strict"
filterwarnings = ["error"]
pythonpath = ["."]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
parallel = true
source = ["services", "workers", "scripts"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise AssertionError",
  "raise NotImplementedError",
]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
files = ["services", "workers", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = false

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".dev"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "DTZ",
  "E",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FURB",
  "I",
  "ICN",
  "INP",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TRY",
  "UP",
  "W",
]
ignore = [
  "ANN401",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["services", "workers", "scripts"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
